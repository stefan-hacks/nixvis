# nixvis CI — Build, test, and push to Cachix binary cache
# =========================================================
#
# This workflow runs on every push to main and on every pull request.
# It:
#   1. Checks out the repository.
#   2. Installs Nix (with flakes enabled).
#   3. Builds nixvis with the "web" feature.
#   4. Runs `cargo test` inside the devShell.
#   5. Pushes the build result to Cachix (only on main branch pushes).
#
# Secrets required (configured in GitHub repo Settings → Secrets and variables):
#   CACHIX_AUTH_TOKEN  — API token from https://nixvis.cachix.org (write access)
#
# To create the Cachix cache:
#   1. Sign up at https://www.cachix.org
#   2. Create a cache named "nixvis"
#   3. Copy the auth token into GitHub Secrets as CACHIX_AUTH_TOKEN

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-cache:
    name: Build and cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix (with flakes)
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nixvis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build nixvis (with web feature)
        run: nix build .# --print-build-logs

      - name: Run tests in devShell
        run: nix develop .# --command cargo test --release

      - name: Push to Cachix (main branch only)
        if: github.ref == 'refs/heads/main'
        run: cachix push nixvis result
