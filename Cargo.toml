[package]
name = "nixvis"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Interactive package explorer and dependency visualizer for the Nix ecosystem"
authors = ["Lin <stefan-hacks>"]
repository = "https://github.com/stefan-hacks/nixvis"
keywords = ["nix", "nixos", "tui", "package-manager", "visualization"]
categories = ["command-line-utilities", "visualization"]
rust-version = "1.78"

[dependencies]
anyhow = "1.0"
open = "5.3"
unicode-segmentation = "1.12"
axum = { version = "0.8", optional = true }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0"
flate2 = "1.1"
http-body-util = { version = "0.1", optional = true }
indicatif = { version = "0.17", optional = true }
nucleo-matcher = "0.3"
owo-colors = { version = "4.1", optional = true }
ratatui = "0.30"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
unicode-width = "0.2"

[features]
default = ["cli"]
cli = ["dep:indicatif", "dep:owo-colors"]
web = ["dep:axum", "dep:tokio", "dep:tower", "dep:http-body-util"]

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
strip = true
